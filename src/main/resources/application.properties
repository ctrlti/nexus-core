spring.application.name=nexus-core

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus_db
spring.datasource.username=postgres
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Telegram
nexus.telegram.bot-username=TsimafeiLifeHubBot
nexus.telegram.bot-token=YOUR_BOT_TOKEN_HERE
nexus.telegram.authorized-chat-id=YOUR_TELEGRAM_ID_HERE