# In-memory H2 database for testing with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway configuration
spring.flyway.enabled=true

# Telegram bot configuration for tests
nexus.telegram.bot-username=test_bot
nexus.telegram.bot-token=dummy_token_123456
nexus.telegram.authorized-chat-id=123456789